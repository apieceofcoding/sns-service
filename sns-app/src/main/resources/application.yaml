spring:
  application:
    name: sns-app
  datasource:
    url: jdbc:postgresql://localhost:5432/snsdb
    username: snsuser
    password: snspassword
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
management:
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false
    sampling:
      probability: 1.0
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: sns-app
  health:
    db:
      enabled: false
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces"
          transport: http
recommend:
  feed-base-url: "${RECOMMEND_FEED_BASE_URL:http://localhost:8001}"
  base-url: "${RECOMMEND_BASE_URL:http://localhost:8081}"
  connect-timeout: 200ms
  timeout: 200ms
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service_name: "${spring.application.name}"
rustfs:
  endpoint: http://localhost:9000
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket: media
  region: ap-northeast-2
  presigned-url-expiration-seconds: 3600
