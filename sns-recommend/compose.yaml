name: sns-recommend
services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: recommend
      POSTGRES_PASSWORD: recommend
      POSTGRES_DB: recommend
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["recommend-index-pg18:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommend -d recommend"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
    ports: ["127.0.0.1:55000:5000"]
    volumes: ["recommend-mlflow:/mlflow"]
volumes:
  recommend-index-pg18:
  recommend-mlflow:
