name: sns-recommend
services:
  # Vectors, events and jobs. Accounts and posts stay in the SNS app database (5432).
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: recommend
      POSTGRES_PASSWORD: recommend
      POSTGRES_DB: recommend
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["recommend-index-pg18:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommend -d recommend"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    profiles: [app]
    ports: ["127.0.0.1:8001:8001"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DATABASE_URL: postgresql://recommend:recommend@db:5432/recommend
      SOURCE_DATABASE_URL: postgresql://snsuser:snspassword@host.docker.internal:5432/snsdb
      REDIS_URL: redis://redis:6379/0
      CURSOR_SECRET: ${CURSOR_SECRET:-course-local-cursor-secret}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["sh", "-c", "uv run sns-recommend init && uv run uvicorn sns_recommend.api:app --host 0.0.0.0 --port 8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    build: .
    volumes: ["./recordings:/app/recordings"]
    profiles: [app]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DATABASE_URL: postgresql://recommend:recommend@db:5432/recommend
      SOURCE_DATABASE_URL: postgresql://snsuser:snspassword@host.docker.internal:5432/snsdb
      REDIS_URL: redis://redis:6379/0
      CURSOR_SECRET: ${CURSOR_SECRET:-course-local-cursor-secret}
      MODEL_MODE: ${MODEL_MODE:-live}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      RERANK_MODEL: ${RERANK_MODEL:-sns-reranker}
      DAILY_CALL_LIMIT: ${DAILY_CALL_LIMIT:-20}
    depends_on:
      api: {condition: service_healthy}
    command: ["uv", "run", "python", "-m", "sns_recommend.worker"]
volumes:
  recommend-index-pg18:
