name: sns-recommend
services:
  # Vectors, events and jobs. Accounts and posts stay in the SNS app database (5432).
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: recommend
      POSTGRES_PASSWORD: recommend
      POSTGRES_DB: recommend
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["recommend-index-pg18:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommend -d recommend"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  batch:
    build: .
    profiles: [batch]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DATABASE_URL: postgresql://recommend:recommend@db:5432/recommend
      SOURCE_DATABASE_URL: postgresql://snsuser:snspassword@host.docker.internal:5432/snsdb
    depends_on:
      db: {condition: service_healthy}
    command: ["uv", "run", "sns-recommend-batch"]
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
volumes:
  recommend-index-pg18:
