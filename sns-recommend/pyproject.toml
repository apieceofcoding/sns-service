[project]
name = "sns-recommend"
version = "0.1.0"
description = "SNS recommendation course API and worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary,pool]>=3.2,<4",
    "redis>=5,<7",
    "pydantic-settings>=2,<3",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "langchain-core>=1,<2",

]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
sns-recommend = "sns_recommend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires course PostgreSQL and Redis"]
